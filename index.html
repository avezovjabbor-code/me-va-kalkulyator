<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muhammadamin — Zamonaviy Professional Kalkulyator</title>
  <meta name="description" content="Muhammadamin nomli zamonaviy, qulay va ilmiy kalkulyator dasturi. Standart, ilmiy amallar, birliklar konverteri va hisoblash tarixi.">
  <meta name="keywords" content="Muhammadamin kalkulyator, web kalkulyator, ilmiy kalkulyator, calculator, zamonaviy kalkulyator">
  <meta name="author" content="Muhammadamin">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="cyber">
  <!-- Dynamic Ambient Background Blobs -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <div class="app-wrapper">
    <!-- Header / Branding -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-avatar">
          <span>M</span>
        </div>
        <div class="brand-info">
          <h1 class="brand-title">MUHAMMADAMIN</h1>
          <span class="brand-tag">Professional Calculator Suite</span>
        </div>
      </div>

      <div class="header-controls">
        <!-- Sound Effect Toggle -->
        <button id="soundToggleBtn" class="icon-btn" title="Ovozni yoqish / o'chirish" aria-label="Ovoz">
          <svg class="icon icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg class="icon icon-sound-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>

        <!-- Theme Picker -->
        <div class="theme-dropdown-wrapper">
          <button id="themeBtn" class="icon-btn" title="Mavzuni almashtirish" aria-label="Mavzu">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>
          <div id="themeMenu" class="theme-menu hidden">
            <button class="theme-opt active" data-theme="cyber">🌌 Cyber Neon</button>
            <button class="theme-opt" data-theme="aurora">🔮 Aurora Violet</button>
            <button class="theme-opt" data-theme="emerald">🌿 Emerald Tech</button>
            <button class="theme-opt" data-theme="sunset">🌅 Sunset Amber</button>
            <button class="theme-opt" data-theme="frost">❄️ Frost Light</button>
          </div>
        </div>

        <!-- History Drawer Button -->
        <button id="historyBtn" class="icon-btn" title="Hisoblash tarixi" aria-label="Tarix">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span id="historyBadge" class="badge">0</span>
        </button>
      </div>
    </header>

    <!-- Main Container -->
    <main class="calculator-card" id="calculatorApp">
      <!-- Mode Tabs -->
      <nav class="mode-navigation">
        <button class="mode-tab active" data-mode="standard">
          <span>Standart</span>
        </button>
        <button class="mode-tab" data-mode="scientific">
          <span>Ilmiy (Scientific)</span>
        </button>
        <button class="mode-tab" data-mode="converter">
          <span>Konverter</span>
        </button>
        <div class="active-indicator"></div>
      </nav>

      <!-- CALCULATOR SCREEN (for Standard and Scientific) -->
      <section class="screen-container" id="calcScreen">
        <!-- Status Bar inside Screen -->
        <div class="screen-meta">
          <div class="screen-status-tags">
            <span id="angleModeBadge" class="badge-tag hidden">DEG</span>
            <span id="memoryBadge" class="badge-tag hidden">M</span>
          </div>
          <div class="screen-actions">
            <button id="copyBtn" class="micro-btn" title="Natijani nusxalash">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span>Nusxalash</span>
            </button>
          </div>
        </div>

        <!-- Secondary History Expression -->
        <div class="expression-display" id="historyDisplay"></div>

        <!-- Primary Calculation Value -->
        <div class="value-display-wrapper">
          <input type="text" id="mainDisplay" class="value-display" value="0" readonly aria-label="Natija">
        </div>
      </section>

      <!-- MEMORY BAR -->
      <div class="memory-bar" id="memoryBar">
        <button class="mem-btn" data-action="mc" id="btnMC">MC</button>
        <button class="mem-btn" data-action="mr" id="btnMR">MR</button>
        <button class="mem-btn" data-action="m+" id="btnMPlus">M+</button>
        <button class="mem-btn" data-action="m-" id="btnMMinus">M-</button>
        <button class="mem-btn" data-action="ms" id="btnMS">MS</button>
      </div>

      <!-- KEYPAD SECTION (Standard & Scientific) -->
      <section class="keypad-container" id="calcKeypad">
        <!-- Scientific Extended Row (Revealed in scientific mode) -->
        <div class="scientific-panel hidden" id="scientificPanel">
          <button class="key func-key" data-action="deg-rad" id="btnDegRad" title="Daraja / Radian">DEG</button>
          <button class="key func-key" data-action="func" data-val="sin" title="Sinus">sin</button>
          <button class="key func-key" data-action="func" data-val="cos" title="Kosinus">cos</button>
          <button class="key func-key" data-action="func" data-val="tan" title="Tangens">tan</button>
          <button class="key func-key" data-action="func" data-val="pi" title="Pi soni (3.1415...)">π</button>
          
          <button class="key func-key" data-action="func" data-val="sqrt" title="Kvadrat ildiz">√x</button>
          <button class="key func-key" data-action="func" data-val="sq" title="Kvadrat (x²)">x²</button>
          <button class="key func-key" data-action="func" data-val="cube" title="Kub (x³)">x³</button>
          <button class="key func-key" data-action="operator" data-val="^" title="Daraja (x^y)">xʸ</button>
          <button class="key func-key" data-action="func" data-val="e" title="Eyler soni (2.718...)">e</button>

          <button class="key func-key" data-action="func" data-val="log" title="O'nli logarifm (log₁₀)">log</button>
          <button class="key func-key" data-action="func" data-val="ln" title="Natural logarifm (ln)">ln</button>
          <button class="key func-key" data-action="func" data-val="fact" title="Faktorial (n!)">n!</button>
          <button class="key func-key" data-action="func" data-val="inv" title="Teskari qiymat (1/x)">1/x</button>
          <button class="key func-key" data-action="func" data-val="abs" title="Modul |x|">|x|</button>
        </div>

        <!-- Standard Keys Grid -->
        <div class="keys-grid">
          <!-- Row 1 -->
          <button class="key clear-key" data-action="clear" id="keyClear" title="Barchasini tozalash (Esc)">AC</button>
          <button class="key backspace-key" data-action="backspace" id="keyBackspace" title="Bitta o'chirish (Backspace)">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
              <line x1="18" y1="9" x2="12" y2="15"></line>
              <line x1="12" y1="9" x2="18" y2="15"></line>
            </svg>
          </button>
          <button class="key util-key" data-action="bracket" data-val="(" title="Ochuvchi qavs">(</button>
          <button class="key util-key" data-action="bracket" data-val=")" title="Yopuvchi qavs">)</button>
          <button class="key operator-key" data-action="operator" data-val="/" id="keyDivide" title="Bo'lish (/)">÷</button>

          <!-- Row 2 -->
          <button class="key num-key" data-action="number" data-val="7">7</button>
          <button class="key num-key" data-action="number" data-val="8">8</button>
          <button class="key num-key" data-action="number" data-val="9">9</button>
          <button class="key util-key" data-action="percent" title="Foiz (%)">%</button>
          <button class="key operator-key" data-action="operator" data-val="*" id="keyMultiply" title="Ko'paytirish (*)">×</button>

          <!-- Row 3 -->
          <button class="key num-key" data-action="number" data-val="4">4</button>
          <button class="key num-key" data-action="number" data-val="5">5</button>
          <button class="key num-key" data-action="number" data-val="6">6</button>
          <button class="key util-key" data-action="negate" title="Musbat / Manfiy (±)">±</button>
          <button class="key operator-key" data-action="operator" data-val="-" id="keySubtract" title="Ayirish (-)">−</button>

          <!-- Row 4 -->
          <button class="key num-key" data-action="number" data-val="1">1</button>
          <button class="key num-key" data-action="number" data-val="2">2</button>
          <button class="key num-key" data-action="number" data-val="3">3</button>
          <button class="key num-key" data-action="number" data-val="00">00</button>
          <button class="key operator-key" data-action="operator" data-val="+" id="keyAdd" title="Qo'shish (+)">+</button>

          <!-- Row 5 -->
          <button class="key num-key key-zero" data-action="number" data-val="0">0</button>
          <button class="key num-key" data-action="dot" title="Nuqta (.)">.</button>
          <button class="key equals-key" data-action="equals" id="keyEquals" title="Natija (Enter)">=</button>
        </div>
      </section>

      <!-- CONVERTER PANEL (Revealed in converter mode) -->
      <section class="converter-panel hidden" id="converterSection">
        <div class="converter-category-tabs">
          <button class="conv-cat-btn active" data-cat="length">📏 Uzunlik</button>
          <button class="conv-cat-btn" data-cat="weight">⚖️ Og'irlik</button>
          <button class="conv-cat-btn" data-cat="temperature">🌡️ Harorat</button>
          <button class="conv-cat-btn" data-cat="data">💾 Ma'lumot</button>
          <button class="conv-cat-btn" data-cat="speed">⚡ Tezlik</button>
        </div>

        <div class="converter-form">
          <!-- From Field -->
          <div class="converter-field-group">
            <label for="convInputVal" class="conv-label">Qiymatni kiriting</label>
            <div class="conv-input-wrap">
              <input type="number" id="convInputVal" class="conv-input" value="1" step="any">
              <select id="convFromUnit" class="conv-select" aria-label="Birligidan"></select>
            </div>
          </div>

          <div class="converter-swap-wrap">
            <button id="convSwapBtn" class="conv-swap-btn" title="O'rinlarini almashtirish">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="7" y1="16" x2="17" y2="16"></line>
                <polyline points="13 20 17 16 13 12"></polyline>
                <line x1="17" y1="8" x2="7" y2="8"></line>
                <polyline points="11 4 7 8 11 12"></polyline>
              </svg>
            </button>
          </div>

          <!-- To Field -->
          <div class="converter-field-group">
            <label for="convOutputVal" class="conv-label">Natija</label>
            <div class="conv-input-wrap">
              <input type="text" id="convOutputVal" class="conv-input conv-output" readonly>
              <select id="convToUnit" class="conv-select" aria-label="Birligiga"></select>
            </div>
          </div>

          <div class="converter-quick-rates" id="convFormulaNote">
            1 Metr = 100 Santimetr
          </div>
        </div>
      </section>

      <!-- Keyboard Shortcuts Hint Footer -->
      <footer class="app-card-footer">
        <span class="shortcut-tip">
          <kbd>0-9</kbd> Sonlar &bull; <kbd>Enter</kbd> = &bull; <kbd>Esc</kbd> AC &bull; <kbd>⌫</kbd> O'chirish
        </span>
      </footer>
    </main>

    <!-- Slide-in History Drawer / Panel -->
    <aside class="history-drawer hidden" id="historyDrawer">
      <div class="drawer-header">
        <div class="drawer-title-group">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <h3>Hisob-kitoblar Tarixi</h3>
        </div>
        <button id="closeDrawerBtn" class="close-btn" title="Yopish">&times;</button>
      </div>

      <div class="drawer-content" id="historyListContainer">
        <!-- Rendered by JS -->
        <div class="empty-history">
          <p>Hozircha hech qanday hisob-kitob amalga oshirilmadi.</p>
        </div>
      </div>

      <div class="drawer-footer">
        <button id="clearAllHistoryBtn" class="danger-btn">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          Tarixni tozalash
        </button>
      </div>
    </aside>

    <!-- Overlay backdrop for Drawer -->
    <div class="drawer-backdrop hidden" id="drawerBackdrop"></div>

    <!-- Toast Notification Popup -->
    <div id="toast" class="toast-notification hidden">
      <span id="toastMsg">Xabar</span>
    </div>

    <!-- Signature Footer -->
    <div class="creator-signature">
      <p>Muallif: <strong>Muhammadamin</strong> &bull; Dasturlash & Dizayn &copy; 2026</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
